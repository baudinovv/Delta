server:
  port: ${PORT:8080}

spring:
  application:
    name: delta-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delta}
    username: ${DB_USER:delta}
    password: ${DB_PASSWORD:delta}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

delta:
  zone: Asia/Almaty
  default-exercises:
    - Squat
    - Bench Press
    - Seated Row
